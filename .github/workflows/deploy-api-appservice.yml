name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-appservice.yml"
  workflow_dispatch:

jobs:
  build_and_deploy_api:
    runs-on: ubuntu-latest
    name: Build and Deploy API
    env:
      AZURE_API_WEBAPP_NAME: ${{ secrets.AZURE_API_WEBAPP_NAME }}
      AZURE_API_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_API_WEBAPP_PUBLISH_PROFILE }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace @pump/api

      - name: Prepare deploy package
        run: |
          mkdir -p api-release
          cp apps/api/package.json api-release/package.json
          cp -R apps/api/dist api-release/dist

      - name: Install production dependencies in deploy package
        run: |
          cd api-release
          npm install --omit=dev

      - name: Validate deployment credentials
        run: |
          if [ -z "$AZURE_API_WEBAPP_NAME" ]; then
            echo "Missing required secret: AZURE_API_WEBAPP_NAME"
            exit 1
          fi

          if [ -z "$AZURE_API_WEBAPP_PUBLISH_PROFILE" ] && [ -z "$AZURE_CREDENTIALS" ]; then
            echo "Missing credentials: set AZURE_API_WEBAPP_PUBLISH_PROFILE or AZURE_CREDENTIALS"
            exit 1
          fi

      - name: Azure Login (service principal fallback)
        if: ${{ env.AZURE_API_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service (publish profile)
        if: ${{ env.AZURE_API_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_API_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_API_WEBAPP_PUBLISH_PROFILE }}
          package: ./api-release

      - name: Deploy to Azure App Service (Azure Login)
        if: ${{ env.AZURE_API_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_API_WEBAPP_NAME }}
          package: ./api-release
