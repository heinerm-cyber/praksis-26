<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pump.no</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      body {

        display: grid;
        place-items: center;

      h1 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }

  <body>
    <main>
      <h1>pump.no er ikke tilgjengelig</h1>
      <p>
        Appen er konfigurert som en web-wrapper. Sett miljøvariabelen
        <strong>PUMP_MOBILE_WEB_URL</strong> i Xcode-skjema for å peke mot hostet
        webapp, og kjør en ny sync.
      </p>
    </main>
