services:
  - type: web
    name: pump-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci ; npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      - key: COSMOS_ENDPOINT
        sync: false
      - key: COSMOS_KEY
        sync: false
      - key: COSMOS_DATABASE
        value: pump
      - key: COSMOS_PROFILE_CONTAINER
        value: profiles
      - key: COSMOS_CALORIE_CONTAINER
        value: calories
      - key: COSMOS_DIET_CONTAINER
        value: diets
      - key: COSMOS_DIET_PLAN_CONTAINER
        value: dietPlans
      - key: COSMOS_TRAINING_CONTAINER
        value: trainingPlans

  - type: web
    name: pump-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci ; npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
